name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...
