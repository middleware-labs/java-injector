name: Integration Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run integration tests
        run: |
          chmod +x tests/integration/run.sh
          tests/integration/run.sh
